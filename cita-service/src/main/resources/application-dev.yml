server:
  port: 8087
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/bd_cita_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
empresa:
  ambiente: desarrollo
servicios:
  paciente:
    url: http://localhost:8085
  medico:
    url: http://localhost:8086

# Configuracion Eureka (GLAB-S12)
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5
    disable-delta: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10