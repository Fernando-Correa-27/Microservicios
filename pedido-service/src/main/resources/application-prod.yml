server:
  port: 9095
spring:
  application:
    name: pedido-service
  datasource:
    url: jdbc:mysql://servidor/bd_pedido
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
empresa:
  ambiente: produccion
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
