server:
  port: 8084
spring:
  application:
    name: pedido-service
  datasource:
    url: jdbc:mysql://localhost:3306/bd_pedido_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: "${DB_PASSWORD:}"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
empresa:
  ambiente: desarrollo
# Configuracion Eureka (GLAB-S12)
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5
    # Dev: refresca el registro completo cada 5 s (evita cache vacia al arrancar en paralelo)
    disable-delta: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
