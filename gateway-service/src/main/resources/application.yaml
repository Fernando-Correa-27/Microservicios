server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: categoria-service
              uri: lb://categoria-service
              predicates:
                - Path=/api/categorias/**

            - id: producto-service
              uri: lb://producto-service
              predicates:
                - Path=/api/productos/**

            - id: cliente-service
              uri: lb://cliente-service
              predicates:
                - Path=/api/clientes/**

            - id: pedido-service
              uri: lb://pedido-service
              predicates:
                - Path=/api/pedidos/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.loadbalancer: DEBUG

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
    registry-fetch-interval-seconds: 5
    disable-delta: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

management:
  # Boot 4: el endpoint `gateway` se declara con defaultAccess = NONE,
  # por eso hay que habilitarlo explicitamente con `access: read`.
  endpoint:
    gateway:
      access: READ_ONLY
  endpoints:
    web:
      exposure:
        include: gateway,health,info
